<!-- @dsCard group="Components" name="Boutons, liens & badges" subtitle="Primaire / secondaire / lien / badge / carte" viewport="900x360" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: #F4EFE1; font-family: 'Montserrat', Helvetica, Arial, sans-serif; color: #2A2A24; }
  a { color: #7C2C42; } a:hover { color: #5E1F31; }
</style>
</head>
<body>
<div style="width: 900px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 28px;">
  <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
    <div style="font-weight: 500; font-size: 14px; color: #FBF8F0; background: #1F3D30; padding: 14px 28px; border-radius: 999px;">Bouton primaire</div>
    <div style="font-weight: 500; font-size: 14px; color: #FBF8F0; background: #2F5443; padding: 14px 28px; border-radius: 999px;">Primaire — hover</div>
    <div style="font-weight: 500; font-size: 14px; color: #1F3D30; background: transparent; border: 1px solid #1F3D30; padding: 13px 27px; border-radius: 999px;">Bouton secondaire</div>
    <a href="#" style="font-weight: 500; font-size: 14px; color: #7C2C42; text-decoration: none; border-bottom: 1px solid #7C2C42; padding-bottom: 2px;">Lien texte</a>
  </div>
  <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
    <div style="font-weight: 500; font-size: 12px; letter-spacing: 0.06em; color: #FBF8F0; background: #C26A80; padding: 6px 14px; border-radius: 999px;">Badge rose</div>
    <div style="font-weight: 500; font-size: 12px; letter-spacing: 0.06em; color: #7C2C42; background: #F3E9D6; padding: 6px 14px; border-radius: 999px;">Alerte douce</div>
    <div style="font-weight: 500; font-size: 12px; letter-spacing: 0.06em; color: #1F3D30; background: #E7E2CC; padding: 6px 14px; border-radius: 999px;">État actif</div>
  </div>
  <div style="background: #FBF8F0; border: 1px solid #E2D6BD; border-radius: 4px; padding: 24px; max-width: 460px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 24px; color: #1F3D30;">Carte de contenu</div>
    <div style="font-weight: 400; font-size: 14px; line-height: 1.6; color: #7A7264;">Bloc sur fond papier #FBF8F0, bordure #E2D6BD, pour les cartes et encadrés.</div>
  </div>
</div>
</body>
</html>
